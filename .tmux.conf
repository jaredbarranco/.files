# ─── TERMINAL & SHELL ─────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set-option -g default-shell /bin/zsh

# ─── PREFIX ───────────────────────────────────────────────────────────
# set -g prefix C-a
# unbind C-b
# bind-key C-a send-prefix

# ─── PANE SPLITS ──────────────────────────────────────────────────────
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# ─── KEYBINDINGS ──────────────────────────────────────────────────────
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key M split-window -h "vim ~/.tmux.conf"

# ─── PANE RESIZING ────────────────────────────────────────────────────
# bind -r j resize-pane -D 5
# bind -r k resize-pane -U 5
# bind -r l resize-pane -R 5
# bind -r h resize-pane -L 5
#
# bind -r m resize-pane -Z

# ─── MOUSE ────────────────────────────────────────────────────────────
set -g mouse on

# ─── COPY MODE ────────────────────────────────────────────────────────
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# ─── DISPLAY & COLORS ─────────────────────────────────────────────────
# Ensure tmux passes 24-bit TrueColor to Ghostty
set -ga terminal-overrides ",xterm-256color:Tc"

# ─── PANE APPEARANCE ──────────────────────────────────────────────────
# Active pane: Transparent to let Ghostty background/blur show through
set -g window-active-style 'bg=default'

# Inactive pane: Solid, darker OneDark slate to simulate opacity dimming
set -g window-style 'bg=#1e222a'

# Optional: Clean up pane borders to match the OneDark palette
set -g pane-border-style 'fg=#3f4451,bg=default'
set -g pane-active-border-style 'fg=#61afef,bg=default'

# ─── INPUT ────────────────────────────────────────────────────────────
# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# ─── PLUGINS (tpm) ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'

# set -g @themepack 'powerline/default/cyan'

# ─── PLUGIN SETTINGS ──────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# continuum skips its auto-save hook when it sees another tmux server (e.g. claude-rc), so add it explicitly
set -g status-right '#(/home/coder/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)Continuum status: #(/home/coder/.tmux/plugins/tmux-continuum/scripts/continuum_status.sh)'

# ─── INITIALIZATION ───────────────────────────────────────────────────
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
